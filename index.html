document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"6fc4704f-12db-43bf-915b-b79218c20f03\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\n<style>\nbody{margin:0;background:#f4f1ea;color:#1d1b18;font-family:'Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased}\na{color:#1d1b18;text-decoration:underline;text-underline-offset:3px}\na:hover{color:#8a3b2a}\n*{box-sizing:border-box}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"max-width:1240px;margin:0 auto;padding:clamp(28px,6vw,56px) clamp(16px,4vw,32px) 96px\">\n  <header style=\"display:flex;flex-wrap:wrap;gap:24px 48px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid #1d1b18;padding-bottom:28px\">\n    <div style=\"flex:1 1 520px\">\n      <div style=\"font-size:13px;letter-spacing:.18em;color:#6b655c;font-weight:500\">THE ART INSTITUTE OF CHICAGO · 관람 가이드<\u002Fdiv>\n      <h1 style=\"font-family:'Noto Serif KR',serif;font-weight:900;font-size:clamp(36px,5.5vw,64px);line-height:1.12;margin:14px 0 0;letter-spacing:-.02em;text-wrap:balance\">인상주의에서<br>후기 인상주의까지<\u002Fh1>\n    <\u002Fdiv>\n    <p style=\"flex:1 1 320px;max-width:420px;margin:0;font-size:15px;line-height:1.75;color:#4a453e;text-wrap:pretty\">작가의 활동 연대 순으로 소장품을 정리했습니다. 작품마다 전시실 번호가 붙어 있으니, 아래 전시실 필터로 동선을 짜 보세요. 이미지를 누르면 크게 볼 수 있습니다.<\u002Fp>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ showTimeline }}\" hint-placeholder-val=\"{{ true }}\">\n    <section style=\"margin-top:40px\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px\">\n        <h2 style=\"font-family:'Noto Serif KR',serif;font-size:22px;margin:0;font-weight:700\">활동 연대표<\u002Fh2>\n        <div style=\"display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:#4a453e\">\n          <sc-for list=\"{{ sections }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:12px;height:12px;border-radius:2px;background:{{ s.color }}\"><\u002Fspan>{{ s.short }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fbf9f5;border:1px solid #d9d3c7;padding:20px 20px 12px\">\n        <div style=\"display:grid;grid-template-columns:120px minmax(0,1fr);gap:0 12px\">\n          <div><\u002Fdiv>\n          <div style=\"position:relative;height:22px;font-size:12px;color:#6b655c\">\n            <sc-for list=\"{{ ticks }}\" as=\"t\" hint-placeholder-count=\"8\">\n              <span style=\"position:absolute;left:{{ t.left }};transform:translateX(-50%)\">{{ t.year }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-for list=\"{{ timeline }}\" as=\"r\" hint-placeholder-count=\"18\">\n            <button sc-camel-on-click=\"{{ r.go }}\" style=\"all:unset;cursor:pointer;font-size:13px;padding:5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#1d1b18\" style-hover=\"color:#8a3b2a\">{{ r.name }}<\u002Fbutton>\n            <div style=\"position:relative;height:28px;border-left:1px solid #d9d3c7;background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(14.2857% - 1px),#e6e0d4 calc(14.2857% - 1px),#e6e0d4 14.2857%)\">\n              <button sc-camel-on-click=\"{{ r.go }}\" title=\"{{ r.years }}\" style=\"all:unset;cursor:pointer;position:absolute;top:7px;height:14px;left:{{ r.left }};width:{{ r.width }};background:{{ r.color }};border-radius:2px\"><\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <div style=\"margin-top:40px;display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n    <span style=\"display:flex;border:1px solid #1d1b18;border-radius:999px;overflow:hidden\">\n      <sc-for list=\"{{ scopeChips }}\" as=\"c\" hint-placeholder-count=\"2\">\n        <button sc-camel-on-click=\"{{ c.pick }}\" style=\"all:unset;cursor:pointer;font-size:13px;padding:9px 14px;background:{{ c.bg }};color:{{ c.fg }}\">{{ c.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fspan>\n    <span style=\"display:flex;gap:6px\">\n      <button sc-camel-on-click=\"{{ expandAll }}\" style=\"all:unset;cursor:pointer;font-size:13px;padding:9px 14px;border:1px solid #1d1b18;border-radius:999px\" style-hover=\"background:#1d1b18;color:#f4f1ea\">모두 펼치기<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ collapseAll }}\" style=\"all:unset;cursor:pointer;font-size:13px;padding:9px 14px;border:1px solid #1d1b18;border-radius:999px\" style-hover=\"background:#1d1b18;color:#f4f1ea\">모두 접기<\u002Fbutton>\n    <\u002Fspan>\n    <span style=\"margin-left:auto;font-size:13px;color:#6b655c\">{{ countLabel }}<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"position:sticky;top:0;z-index:5;background:#f4f1ea;margin-top:12px;padding:10px 0;border-bottom:1px solid #d9d3c7\">\n    <div style=\"display:flex;align-items:center;gap:8px;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none\">\n      <span style=\"font-size:13px;color:#6b655c;margin-right:2px;flex:none\">전시실<\u002Fspan>\n      <sc-for list=\"{{ galleryChips }}\" as=\"g\" hint-placeholder-count=\"14\">\n        <button sc-camel-on-click=\"{{ g.pick }}\" style=\"all:unset;flex:none;cursor:pointer;font-size:13px;padding:9px 14px;border:1px solid {{ g.border }};background:{{ g.bg }};color:{{ g.fg }};border-radius:999px;font-variant-numeric:tabular-nums\">{{ g.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-for list=\"{{ sections }}\" as=\"s\" hint-placeholder-count=\"3\">\n    <sc-if value=\"{{ s.visible }}\" hint-placeholder-val=\"{{ true }}\">\n      <section style=\"margin-top:64px\">\n        <button sc-camel-on-click=\"{{ s.toggle }}\" style=\"all:unset;cursor:pointer;width:100%;display:flex;align-items:baseline;gap:20px;flex-wrap:wrap;border-bottom:1px solid #1d1b18;padding-bottom:14px\" style-hover=\"opacity:.8\">\n          <span style=\"font-family:'Noto Serif KR',serif;font-size:clamp(40px,8vw,56px);font-weight:900;line-height:1;color:{{ s.color }}\">{{ s.num }}<\u002Fspan>\n          <h2 style=\"font-family:'Noto Serif KR',serif;font-size:clamp(24px,3vw,34px);margin:0;font-weight:700;letter-spacing:-.01em\">{{ s.title }}<\u002Fh2>\n          <span style=\"font-size:15px;color:#6b655c\">{{ s.period }}<\u002Fspan>\n          <span style=\"margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13px;color:#6b655c\">\n            <span>{{ s.summary }}<\u002Fspan>\n            <span style=\"width:32px;height:32px;border:1px solid #1d1b18;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:#1d1b18;line-height:1\">{{ s.chevron }}<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fbutton>\n        <sc-if value=\"{{ s.closed }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:14px 0 0;font-size:14px;color:#4a453e;line-height:1.7;text-wrap:pretty\">{{ s.names }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ s.open }}\" hint-placeholder-val=\"{{ true }}\">\n        <sc-for list=\"{{ s.artists }}\" as=\"a\" hint-placeholder-count=\"4\">\n          <article id=\"{{ a.anchor }}\" style=\"display:flex;flex-wrap:wrap;gap:28px 40px;padding:36px 0;border-bottom:1px solid #d9d3c7\">\n            <div style=\"flex:1 1 280px;max-width:380px\">\n              <div style=\"display:flex;align-items:center;gap:10px\">\n                <span style=\"width:8px;height:8px;border-radius:50%;background:{{ s.color }}\"><\u002Fspan>\n                <span style=\"font-size:13px;color:#6b655c;font-variant-numeric:tabular-nums;letter-spacing:.04em\">{{ a.years }}<\u002Fspan>\n              <\u002Fdiv>\n              <h3 style=\"font-family:'Noto Serif KR',serif;font-size:clamp(24px,5vw,30px);font-weight:700;margin:10px 0 2px;letter-spacing:-.01em;text-wrap:balance\">{{ a.name }}<\u002Fh3>\n              <div style=\"font-size:14px;color:#6b655c;font-style:italic\">{{ a.en }}<\u002Fdiv>\n              <sc-if value=\"{{ a.hasBio }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-top:6px;font-size:13px;color:#4a453e;font-variant-numeric:tabular-nums\">{{ a.life }}<\u002Fdiv>\n              <div style=\"margin-top:22px;font-size:12px;letter-spacing:.14em;color:#6b655c;font-weight:700\">작가 소개<\u002Fdiv>\n              <p style=\"margin:8px 0 0;font-size:15px;line-height:1.8;text-wrap:pretty\">{{ a.bio }}<\u002Fp>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ a.hasSig }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-top:22px;font-size:12px;letter-spacing:.14em;color:#6b655c;font-weight:700\">미술사적 의의<\u002Fdiv>\n              <p style=\"margin:8px 0 0;font-size:15px;line-height:1.8;text-wrap:pretty\">{{ a.sig }}<\u002Fp>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"flex:3 1 460px;min-width:0;display:flex;flex-direction:column;gap:22px\">\n              <sc-if value=\"{{ a.hasWorks }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:20px 14px\">\n                <sc-for list=\"{{ a.works }}\" as=\"w\" hint-placeholder-count=\"3\">\n                  <figure style=\"margin:0;display:flex;flex-direction:column;gap:8px\">\n                    <sc-if value=\"{{ showImages }}\" hint-placeholder-val=\"{{ true }}\">\n                      <button sc-camel-on-click=\"{{ w.open }}\" style=\"all:unset;cursor:zoom-in;display:block;aspect-ratio:4/3;background:#e3ddd1;overflow:hidden;position:relative\" style-hover=\"outline:2px solid #1d1b18;outline-offset:2px\">\n                        <sc-if value=\"{{ w.hasImg }}\" hint-placeholder-val=\"{{ false }}\">\n                          <img src=\"{{ w.thumb }}\" alt=\"{{ w.title }}\" loading=\"lazy\" sc-camel-referrer-policy=\"no-referrer\" sc-camel-on-error=\"{{ imgErr }}\" style=\"width:100%;height:100%;object-fit:cover;display:block\">\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ w.noImg }}\" hint-placeholder-val=\"{{ true }}\">\n                          <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;text-align:center;font-size:12px;color:#8a8378;line-height:1.5\">{{ w.status }}<\u002Fdiv>\n                        <\u002Fsc-if>\n                      <\u002Fbutton>\n                    <\u002Fsc-if>\n                    <figcaption style=\"display:flex;flex-direction:column;gap:3px\">\n                      <sc-if value=\"{{ w.phase }}\" hint-placeholder-val=\"{{ false }}\">\n                        <span style=\"font-size:11px;letter-spacing:.1em;color:{{ s.color }};font-weight:700\">{{ w.phase }}<\u002Fspan>\n                      <\u002Fsc-if>\n                      <a target=\"_self\" href=\"{{ w.link }}\" style=\"font-family:'Noto Serif KR',serif;font-size:15px;font-weight:600;line-height:1.45;text-wrap:pretty;color:#1d1b18;text-decoration:none\" style-hover=\"color:#8a3b2a;text-decoration:underline\">「{{ w.title }}」 ↗<\u002Fa>\n                      <span style=\"font-size:12px;color:#6b655c;font-style:italic;line-height:1.4\">{{ w.en }}<\u002Fspan>\n                      <span style=\"display:flex;gap:8px;align-items:center;font-size:12px;color:#6b655c\">\n                        <span style=\"border:1px solid #b9b1a3;padding:1px 6px;border-radius:3px;font-variant-numeric:tabular-nums;color:#1d1b18\">{{ w.galleryLabel }}<\u002Fspan>\n                        <span>{{ w.by }}<\u002Fspan>\n                      <\u002Fspan>\n                    <\u002Ffigcaption>\n                  <\u002Ffigure>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ a.hasNotes }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"background:#fbf9f5;border-top:3px solid {{ s.color }};padding:16px 20px\">\n                <div style=\"font-size:12px;letter-spacing:.14em;color:#6b655c;font-weight:700\">관람 포인트<\u002Fdiv>\n                <div style=\"margin-top:8px;display:flex;flex-direction:column;gap:10px\">\n                  <sc-for list=\"{{ a.tips }}\" as=\"tp\" hint-placeholder-count=\"2\">\n                    <div style=\"display:flex;gap:10px;font-size:15px;line-height:1.8;text-wrap:pretty\"><span style=\"color:{{ s.color }};font-weight:700\">·<\u002Fspan><span>{{ tp.t }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ a.hasExtras }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-direction:column;gap:14px\">\n                  <div style=\"display:flex;align-items:baseline;gap:10px;border-bottom:1px solid #d9d3c7;padding-bottom:8px\">\n                    <span style=\"font-size:12px;letter-spacing:.14em;color:#6b655c;font-weight:700\">그 외 소장작<\u002Fspan>\n                    <span style=\"font-size:12px;color:#6b655c;font-variant-numeric:tabular-nums\">{{ a.extraLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:16px 12px\">\n                    <sc-for list=\"{{ a.extrasShown }}\" as=\"x\" hint-placeholder-count=\"6\">\n                      <figure style=\"margin:0;display:flex;flex-direction:column;gap:6px\">\n                        <sc-if value=\"{{ showImages }}\" hint-placeholder-val=\"{{ true }}\">\n                          <button sc-camel-on-click=\"{{ x.open }}\" style=\"all:unset;cursor:zoom-in;display:block;aspect-ratio:1/1;background:#e3ddd1;overflow:hidden;position:relative\" style-hover=\"outline:2px solid #1d1b18;outline-offset:2px\">\n                            <sc-if value=\"{{ x.hasImg }}\" hint-placeholder-val=\"{{ false }}\">\n                              <img src=\"{{ x.thumb }}\" alt=\"{{ x.title }}\" loading=\"lazy\" sc-camel-referrer-policy=\"no-referrer\" sc-camel-on-error=\"{{ imgErr }}\" style=\"width:100%;height:100%;object-fit:cover;display:block\">\n                            <\u002Fsc-if>\n                            <sc-if value=\"{{ x.noImg }}\" hint-placeholder-val=\"{{ false }}\">\n                              <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#8a8378\">이미지 없음<\u002Fdiv>\n                            <\u002Fsc-if>\n                          <\u002Fbutton>\n                        <\u002Fsc-if>\n                        <a target=\"_self\" href=\"{{ x.link }}\" style=\"font-size:12px;line-height:1.4;color:#1d1b18;text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden\" style-hover=\"color:#8a3b2a;text-decoration:underline\">{{ x.ko }}<\u002Fa>\n                        <span style=\"font-size:11px;color:#6b655c;font-style:italic;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden\">{{ x.title }}<\u002Fspan>\n                        <span style=\"font-size:11px;color:#6b655c;font-variant-numeric:tabular-nums\">{{ x.meta }}<\u002Fspan>\n                      <\u002Ffigure>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ a.hasMore }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button sc-camel-on-click=\"{{ a.toggleMore }}\" style=\"all:unset;cursor:pointer;align-self:flex-start;font-size:13px;padding:6px 14px;border:1px solid #b9b1a3;border-radius:999px\" style-hover=\"border-color:#1d1b18\">{{ a.moreLabel }}<\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fsc-for>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fsc-if>\n  <\u002Fsc-for>\n\n  <footer style=\"margin-top:56px;font-size:12px;color:#6b655c;line-height:1.7\">이미지: Art Institute of Chicago 퍼블릭 API (CC0). 전시실 번호는 변동될 수 있으니 방문 전 미술관 홈페이지에서 확인하세요.<\u002Ffooter>\n<\u002Fdiv>\n\n<sc-if value=\"{{ lb.on }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ lb.close }}\" style=\"position:fixed;inset:0;z-index:50;background:rgba(20,18,16,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;gap:18px;cursor:zoom-out\">\n    {{ lbImage }}\n    <div style=\"text-align:center;color:#f4f1ea;display:flex;flex-direction:column;gap:6px\">\n      <span style=\"font-family:'Noto Serif KR',serif;font-size:20px;font-weight:600\">「{{ lb.title }}」<\u002Fspan>\n      <span style=\"font-size:13px;color:#bdb5a8\">{{ lb.meta }}<\u002Fspan>\n      <a target=\"_self\" href=\"{{ lb.link }}\" sc-camel-on-click=\"{{ lb.stop }}\" style=\"font-size:13px;color:#f4f1ea\">미술관 작품 페이지 열기 ↗<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showTimeline&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showImages&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;extrasScope&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;onView&quot;,&quot;all&quot;],&quot;default&quot;:&quot;onView&quot;,&quot;tsType&quot;:&quot;'onView'|'all'&quot;}}\">\nconst D = [\n {num:'01',title:'인상주의의 선구와 1세대',short:'인상주의',period:'1860–1880년대',color:'oklch(0.52 0.11 245)',artists:[\n  {name:'에두아르 마네',en:'Édouard Manet',years:'1860–1883',y:[1860,1883],\n   sig:'아카데미 회화의 매끈한 마무리를 버리고 \"현대 생활\"을 그려 인상주의의 길을 열었습니다. 정작 인상주의 전시에는 한 번도 참여하지 않았습니다.',\n   tip:'「롱샹 경마」는 말이 관람자 쪽으로 정면 돌진하는 구도가 당시로서는 파격입니다. 군중이 얼룩으로 뭉개진 부분을 보시면 속도감을 어떻게 그렸는지 알 수 있습니다.',\n   s:'manet',works:[['롱샹 경마','225','Races at Longchamp'],['투우','225','Bullfight Manet'],['책 읽는 여인','201','Woman Reading Manet']]},\n  {name:'카미유 피사로',en:'Camille Pissarro',years:'1870–1890년대',y:[1870,1899],\n   sig:'여덟 번의 인상주의 전시에 모두 참여한 유일한 작가로, 세잔과 고갱을 이끈 스승 격입니다.',\n   tip:'「수정궁」은 보불전쟁을 피해 런던에 머물 때 그린 것입니다. 유명 건물보다 평범한 교외 거리에 무게를 둔 점이 피사로답습니다.',\n   s:'pissarro',works:[['수정궁','201','The Crystal Palace Pissarro'],['개울에서 발 씻는 여인','248','Woman Bathing Her Feet in a Brook']]},\n  {name:'클로드 모네',en:'Claude Monet',years:'1867–1920년대',y:[1867,1926],\n   sig:'대상이 아니라 빛과 대기 자체를 주제로 삼았습니다. 「건초더미」는 같은 소재를 조건만 바꿔 반복한 최초의 본격 연작으로, 이후 추상회화로 가는 다리가 됩니다.',\n   tip:'225 → 201 → 240 → 243 순서로 보시면 한 작가의 50년이 이어집니다. 「건초더미」는 한 점씩 보지 말고 방 한가운데서 여섯 점을 한꺼번에 비교하시는 것이 핵심입니다.',\n   s:'monet',works:[['생타드레스 해변','225','The Beach at Sainte-Adresse','초기'],['센 강변, 베네쿠르','201','On the Bank of the Seine, Bennecourt','초기'],['푸르빌 절벽 산책','240','Cliff Walk at Pourville','중기'],['에트르타 (2점)','240','Etretat Monet','중기'],['건초더미 (6점)','243','Stacks of Wheat Monet','후기'],['런던 연작','243','Houses of Parliament London Monet','후기'],['수련','243','Water Lilies Monet','후기']]},\n  {name:'알프레드 시슬레',en:'Alfred Sisley',years:'1870년대',y:[1870,1879],\n   sig:'평생 풍경화만 그린 가장 \"순수한\" 인상주의자입니다.',\n   tip:'화려하지 않지만 하늘이 화면의 절반을 차지하는 구성과 차분한 회색 톤이 좋습니다. 붐비는 201번에서 쉬어 가기 좋은 그림입니다.',\n   s:'sisley',works:[['포르마를리의 센강, 모래 더미','201','Seine at Port-Marly, Piles of Sand'],['마를리의 물 마시는 곳','201','Watering Place at Marly']]},\n  {name:'피에르오귀스트 르누아르',en:'Pierre-Auguste Renoir',years:'1870–1880년대',y:[1870,1889],\n   sig:'인상주의 기법을 풍경이 아닌 인물과 일상의 즐거움에 적용했습니다. 1880년대 초부터는 윤곽이 또렷해지는 고전적 경향으로 넘어갑니다.',\n   tip:'「두 자매」는 또렷한 얼굴과 흐릿하게 풀어진 배경의 대비를 보십시오. 앞쪽 털실 바구니의 원색들이 화면 전체의 팔레트를 요약합니다.',\n   s:'renoir',works:[['두 자매 (테라스에서)','201','Two Sisters (On the Terrace)'],['페르난도 서커스의 곡예사들','201','Acrobats at the Cirque Fernando'],['피아노 치는 여인','201','Woman at the Piano Renoir']]},\n  {name:'에드가 드가',en:'Edgar Degas',years:'1870–1890년대',y:[1870,1899],\n   sig:'야외 풍경 대신 실내와 도시의 인물을 그렸고, 소묘와 구도를 중시했습니다. 일본 판화와 사진에서 온 과감한 잘라내기 구도가 특징입니다.',\n   tip:'「모자 가게」는 위에서 비스듬히 내려다보는 시점이고, 주인공인 여성보다 모자들이 더 화려합니다. 우연한 스냅사진 같지만 치밀하게 계산된 화면입니다.',\n   s:'degas',works:[['모자 가게','226','The Millinery Shop'],['노란 무용수들','226','Yellow Dancers (In the Wings)'],['카페 가수','226','The Cafe Singer Degas'],['무용수 조각','226','Degas dancer bronze']]},\n  {name:'베르트 모리조',en:'Berthe Morisot',years:'1870–1880년대',y:[1870,1889],\n   sig:'인상주의 창립 멤버이며, 그룹 안에서도 붓질이 가장 자유롭고 빠른 작가로 꼽힙니다.',\n   tip:'「화장하는 여인」은 가까이 가면 형태가 거의 해체되어 있습니다. 은회색과 분홍의 붓 자국만으로 살결과 천을 구분해 내는 솜씨가 볼거리입니다.',\n   s:'morisot',works:[['화장하는 여인','201','Woman at Her Toilette'],['정원의 여인','201','Woman in a Garden Morisot']]},\n  {name:'귀스타브 카유보트',en:'Gustave Caillebotte',years:'1875–1882',y:[1875,1882],\n   sig:'1877년 제3회 인상주의전 출품작입니다. 오스만이 개조한 근대 파리를 거의 실물 크기 인물로 그렸고, 인상주의 그룹 안에서 사실주의적 정밀함을 대표합니다.',\n   tip:'가로등이 화면을 정확히 둘로 나누고, 오른쪽 인물은 잘려 나갑니다. 비 자체는 그리지 않고 젖은 포석의 반사로만 표현한 점을 확인해 보십시오.',\n   s:'caillebotte',works:[['파리 거리, 비 오는 날','201','Paris Street; Rainy Day']]}\n ]},\n {num:'02',title:'신인상주의와 후기 인상주의',short:'신인상·후기 인상주의',period:'1880–1900년대',color:'oklch(0.6 0.13 65)',artists:[\n  {name:'폴 세잔',en:'Paul Cézanne',years:'1880–1900년대',y:[1880,1906],\n   sig:'인상주의의 순간적 인상에 견고한 구조를 부여하려 했습니다. 한 화면에 여러 시점을 넣어 입체주의의 직접적 출발점이 됩니다.',\n   tip:'「사과 바구니」는 탁자 좌우 높이가 맞지 않고 병이 기울어 있는데, 실수가 아니라 의도입니다. 「마르세유만」은 지붕, 바다, 산이 색면 블록으로 쌓인 구조를 보십시오.',\n   s:'cézanne',works:[['사과 바구니','248','The Basket of Apples'],['에스타크에서 본 마르세유만','248','Bay of Marseille, Seen from L\\'Estaque'],['노란 의자의 세잔 부인','248','Madame Cezanne in a Yellow Chair'],['목욕하는 사람들','248','The Bathers Cezanne']]},\n  {name:'조르주 쇠라',en:'Georges Seurat',years:'1883–1891',y:[1883,1891],\n   sig:'1886년 마지막 인상주의전에 출품되어 \"신인상주의\"라는 이름을 낳은 작품입니다. 색을 섞지 않고 점으로 병치해 눈에서 혼합되게 하는 점묘법을 확립했습니다.',\n   tip:'이 미술관의 대표작입니다. 인물들이 조각상처럼 굳어 있고 서로 시선을 나누지 않아, 휴일 풍경인데도 묘하게 고요하고 낯섭니다. 멀리서 한 번, 가까이서 한 번 보십시오.',\n   s:'seurat',works:[['그랑드 자트 섬의 일요일 오후','240','A Sunday on La Grande Jatte 1884'],['그랑드 자트 유화 습작','240','Oil Sketch for A Sunday on La Grande Jatte'],['아니에르의 물놀이 최종 습작','240','Final Study for Bathing at Asnieres']]},\n  {name:'폴 시냐크',en:'Paul Signac',years:'1886–1900년대',y:[1886,1909],\n   sig:'쇠라 사후 신인상주의를 이론화하고 이끌어, 마티스 등 야수파에 영향을 주었습니다.',\n   tip:'쇠라 옆에 걸려 있어 비교하기 좋습니다. 같은 기법이지만 쇠라보다 밝고 경쾌합니다.',\n   s:'signac',works:[['레장들리','240','Les Andelys Signac']]},\n  {name:'빈센트 반 고흐',en:'Vincent van Gogh',years:'1886–1890',y:[1886,1890],\n   sig:'파리에서 인상주의와 점묘법을 흡수한 뒤, 색과 붓질을 감정 표현의 수단으로 바꾸어 표현주의의 선구가 됩니다.',\n   tip:'「자화상」(1887)은 점묘법을 자기 식으로 바꾼 짧은 선들이 배경에서 소용돌이칩니다. 「침실」은 벽과 바닥이 기울어 방이 불안정해 보이는데, 본인은 \"휴식\"을 그리려 했다는 점이 아이러니합니다.',\n   s:'gogh',works:[['자화상','241','Self-Portrait 1887 van Gogh','파리'],['봄 낚시, 클리시 다리','241','Fishing in Spring, the Pont de Clichy','파리'],['침실','241','The Bedroom van Gogh','아를·생레미'],['룰랭 부인 (자장가)','241','Madame Roulin Rocking the Cradle','아를·생레미'],['술 마시는 사람들','241','The Drinkers (after Daumier)','아를·생레미']]},\n  {name:'앙리 드 툴루즈로트레크',en:'Henri de Toulouse-Lautrec',years:'1887–1900',y:[1887,1900],\n   sig:'몽마르트르 밤 문화를 날카로운 선과 인공조명의 색으로 그렸고, 포스터를 예술 장르로 끌어올렸습니다.',\n   tip:'「물랭 루주에서」 오른쪽 아래, 초록빛 조명을 받은 여인의 얼굴이 압권입니다. 뒤쪽에 키 큰 사촌과 나란히 걷는 작은 인물이 작가 본인입니다.',\n   s:'toulouse',works:[['물랭 루주에서','242','At the Moulin Rouge Toulouse-Lautrec'],['물랭 드 라 갈레트','242','Moulin de la Galette Toulouse-Lautrec'],['페르난도 서커스의 여자 곡마사','242','Equestrienne (At the Cirque Fernando)']]},\n  {name:'폴 고갱',en:'Paul Gauguin',years:'1888–1903',y:[1888,1903],\n   sig:'눈에 보이는 것 대신 기억과 상상을 평평한 색면과 굵은 윤곽으로 그리는 종합주의를 세웠습니다. 나비파와 야수파에 직접 영향을 주었습니다.',\n   tip:'241번에서 고흐와 나란히 보시면 같은 아를에서 얼마나 다르게 그렸는지 드러납니다. 「신의 날」은 아래쪽 물 표현이 거의 추상화이니 그 부분을 꼭 보십시오.',\n   s:'gauguin',works:[['아를의 여인들 (미스트랄)','241','Arlesiennes (Mistral)','아를'],['신의 날','247','Mahana no atua (Day of the God)','타히티'],['테하마나의 조상들','247','Merahi metua no T 16:'투우가 끝난 뒤',69780:'이탈리아 프라스카티, 토를로니아 저택의 분수',4749:'조지 스윈턴 부인',191183:'폴 에스퀴디에 부인',25865:'청어 그물',44018:'크로케 장면',11320:'아담',719:'칼레의 시민 (장 데르)',87467:'에두아르 마네',75507:'정물: 탁자 모서리',109780:'겨울의 즐거움',28849:'도시 공원',15401:'무캥 식당에서',64729:'이른 아침, 타폰 스프링스',87643:'무덤 앞의 두 제자',11393:'헨리 오사와 태너',15705:'휴식',80499:'도로테아와 프란체스카',27764:'다가오는 폭풍',110867:'줄타기 곡예사',110661:'자화상'};\nconst BIO={\n'Édouard Manet':['1832–1883 · 프랑스 파리','파리의 부유한 법관 집안에서 태어나 토마 쿠튀르의 화실에서 배웠습니다. 1863년 낙선전의 「풀밭 위의 점심」과 1865년 살롱의 「올랭피아」로 큰 스캔들을 일으켰습니다. 벨라스케스와 고야 같은 스페인 회화에 깊이 빠졌고, 카페 게르부아에 모이던 젊은 화가들의 정신적 지주였습니다.','「투우」는 1865년 스페인 여행 직후의 작품입니다. 벨라스케스에게 배운 검은색과 회색의 깊이를 보십시오. 「책 읽는 여인」은 맥주잔 너머로 잡지를 읽는 카페의 여인을 아주 빠른 붓질로 잡아낸 말년작입니다.'],\n'Camille Pissarro':['1830–1903 · 덴마크령 서인도 세인트토머스섬','카리브해의 유대계 상인 집안에서 태어나 1855년 파리로 왔습니다. 퐁투아즈와 에라니에 살며 농촌과 농민을 꾸준히 그렸습니다. 1880년대 후반에는 쇠라의 점묘법을 받아들이기도 했고, 말년에는 눈병 때문에 호텔 창가에서 파리와 루앙의 거리를 연작으로 그렸습니다.','「개울에서 발 씻는 여인」은 248번 세잔 작품 곁에 걸려 있어, 스승과 제자가 서로에게 무엇을 배웠는지 비교하기 좋습니다. 농촌 여인을 미화하지 않는 담백한 시선이 피사로답습니다.'],\n'Claude Monet':['1840–1926 · 프랑스 파리','르아브르에서 자랐고, 외젠 부댕에게서 야외 사생을 배웠습니다. 1874년 첫 전시에 낸 「인상, 해돋이」가 운동의 이름이 되었습니다. 1883년 지베르니에 정착해 정원과 연못을 직접 만들고, 말년 30년 가까이 그 정원을 그렸습니다. 말년에는 백내장으로 색이 붉게 변해 갑니다.','런던 연작은 템스강의 안개 속 국회의사당과 다리를 같은 각도에서 시간대만 바꿔 그린 것입니다. 「수련」은 하늘이 수면에 비친 모습과 물 위의 잎이 한 평면에 겹쳐 원근이 사라지는 점을 보십시오.'],\n'Alfred Sisley':['1839–1899 · 프랑스 파리 (영국 국적)','파리에서 영국인 부모에게서 태어났습니다. 부유하게 자랐지만 1870년 보불전쟁 뒤 가업이 파산해 평생 가난하게 살았습니다. 마를리와 모레쉬르루앙 근교의 강과 마을을 그렸고, 프랑스 국적을 끝내 얻지 못했으며 사후에야 제대로 평가받았습니다.','「모래 더미」는 강변의 모래 하역 현장을 그린 그림입니다. 노동과 산업의 풍경도 하늘과 물처럼 담담하게 풍경의 일부로 담아냅니다.'],\n'Pierre-Auguste Renoir':['1841–1919 · 프랑스 리모주','재단사 집안에서 태어나 도자기 채색공으로 일을 시작했습니다. 글레르 화실에서 모네, 시슬레, 바지유를 만났습니다. 1881년 이탈리아에서 라파엘로를 본 뒤 윤곽을 또렷이 하는 \"앵그르 시기\"를 거쳤고, 말년에는 류머티즘으로 손에 붓을 묶고 그렸습니다.','「페르난도 서커스의 곡예사들」은 실제 곡예사 자매를 그린 것으로, 관객석이 위쪽에서 잘려 나가고 바닥에 오렌지가 흩어져 있습니다. 「피아노 치는 여인」에서는 흰 옷에 드리운 푸른 그림자를 보십시오.'],\n'Edgar Degas':['1834–1917 · 프랑스 파리','부유한 은행가 집안 출신으로, 앵그르를 숭배하며 에콜 데 보자르에서 배우고 이탈리아에서 고전을 공부했습니다. 스스로는 \"인상주의자\"보다 \"사실주의자\"로 불리기를 원했습니다. 파스텔, 모노타이프, 밀랍 조각까지 매체 실험을 즐겼고, 말년에 시력이 나빠지자 조각과 파스텔에 집중했습니다.','「노란 무용수들」은 화려한 공연이 아니라 무대 옆에서 기다리는 순간을 그렸습니다. 무용수 조각은 드가가 생전에 밀랍으로 빚은 것을 사후에 청동으로 주조한 것입니다.'],\n'Berthe Morisot':['1841–1895 · 프랑스 부르주','상류층 집안에서 자라 코로에게 풍경을 배웠습니다. 마네의 모델이었고 마네의 동생 외젠과 결혼했습니다. 여성이라 카페 모임에 낄 수 없었기에 집과 정원, 여성과 아이를 주로 그렸습니다. 여덟 번의 인상주의전 가운데 딸을 낳은 해를 빼고 일곱 번 참여했습니다.','「정원의 여인」은 배경의 초록 붓질이 인물과 거의 섞여 있고, 가장자리는 미완성처럼 풀어져 있습니다. 그 \"덜 그린\" 느낌이 바로 모리조가 노린 효과입니다.'],\n'Gustave Caillebotte':['1848–1894 · 프랑스 파리','부유한 집안에서 법학을 공부한 뒤 그림을 시작했습니다. 물려받은 재산으로 동료들의 그림을 사 주고 전시 비용을 댔습니다. 사후 그의 소장품이 국가에 기증되었고(카유보트 유증), 이것이 오늘날 오르세 미술관 인상주의 컬렉션의 핵심이 됩니다.','이 그림은 가로 약 2.8m로, 앞에 서면 거리에 들어선 듯한 크기입니다. 오른쪽 커플과 왼쪽 원경이 서로 다른 시점으로 그려져 있고, 회색 우산들이 반복되며 리듬을 만듭니다.'],\n'Paul Cézanne':['1839–1906 · 프랑스 엑상프로방스','은행가의 아들로, 소설가 에밀 졸라와는 어린 시절 친구였습니다. 파리 살롱에서 낙선을 거듭했고, 퐁투아즈에서 피사로와 함께 그리며 색이 밝아졌습니다. 1880년대 이후 고향에 머물며 생트빅투아르산을 반복해 그렸고, 1895년 볼라르의 개인전 이후 젊은 화가들에게 숭배받았습니다.','「노란 의자의 세잔 부인」의 모델 오르탕스 피케는 세잔의 초상화에 20번 넘게 등장합니다. 표정 없는 얼굴을 사과처럼 하나의 형태로 다룬다는 점이 핵심입니다.'],\n'Georges Seurat':['1859–1891 · 프랑스 파리','에콜 데 보자르에서 배우고 슈브뢸과 루드의 색채 과학을 연구했습니다. 1884년 「아니에르의 물놀이」가 살롱에서 낙선하자 앵데팡당전에 참여했습니다. 「그랑드 자트」에는 2년과 수십 점의 습작이 들어갔습니다. 31세에 갑자기 세상을 떠났습니다.','캔버스 가장자리에 쇠라가 나중에 직접 칠해 넣은 점묘 테두리를 찾아보십시오. 오른쪽에서 원숭이를 끈에 묶어 데리고 다니는 여인 같은 풍자적 요소도 숨어 있습니다.'],\n'Paul Signac':['1863–1935 · 프랑스 파리','독학으로 그림을 시작했고 쇠라를 만나 점묘법에 뛰어들었습니다. 1899년 『들라크루아에서 신인상주의까지』를 써서 이론을 정리했습니다. 요트로 지중해 항구들을 돌며 그렸고, 생트로페에 정착해 마티스를 초대했습니다.','쇠라보다 점이 크고 색 대비가 강해 화면이 반짝입니다. 두 작가 작품 사이를 오가며 점의 크기와 간격을 비교해 보십시오.'],\n'Vincent van Gogh':['1853–1890 · 네덜란드 쥔더르트','목사의 아들로 화랑 점원과 전도사를 거쳐 27세에 화가가 되었습니다. 동생 테오의 후원을 받았고 그와 나눈 편지가 수백 통 남아 있습니다. 1886년 파리, 1888년 아를로 옮겨 고갱과 두 달을 함께 지냈고, 생레미 요양원을 거쳐 오베르에서 37세로 세상을 떠났습니다.','「침실」은 세 버전 중 1889년의 두 번째 버전입니다. 「룰랭 부인」은 손에 요람 줄을 쥐고 있고, 뒤의 꽃무늬 벽지가 인물을 감쌉니다. 「술 마시는 사람들」은 도미에의 판화를 색채로 옮겨 그린 것입니다.'],\n'Henri de Toulouse-Lautrec':['1864–1901 · 프랑스 알비','남프랑스 귀족 가문에서 태어났으나 유전 질환과 어린 시절의 골절로 다리가 자라지 않았습니다. 코르몽 화실에서 고흐와 친구가 되었고, 몽마르트르의 카바레와 사창가에 머물며 그 사람들을 그렸습니다. 물랭 루주 포스터로 유명해졌고, 알코올 중독으로 36세에 세상을 떠났습니다.','「물랭 드 라 갈레트」는 앞쪽 난간이 화면을 사선으로 가르고, 춤추는 사람들보다 무표정한 여인들에게 시선이 갑니다. 「여자 곡마사」는 위에서 비스듬히 내려다본 원형 무대를 보십시오.'],\n'Paul Gauguin':['1848–1903 · 프랑스 파리','어린 시절을 페루에서 보냈고, 선원과 증권 중개인으로 일하며 주말에 그림을 그렸습니다. 1882년 증시 폭락 뒤 전업 화가가 되어 브르타뉴 퐁타벤, 아를, 타히티를 거쳐 마르키즈 제도에서 세상을 떠났습니다. 오늘날에는 그의 식민주의적 시선도 함께 비판적으로 논의됩니다.','「왜 화가 났니?」는 원제가 타히티어 \"No te aha oe riri\"입니다. 「테하마나의 조상들」 배경 벽에는 이스터섬의 롱고롱고 문자를 닮은 기호가 그려져 있습니다.'],\n'Pierre Puvis de Chavannes':['1824–1898 · 프랑스 리옹','소르본과 리옹 미술관, 보스턴 공공도서관의 벽화를 그린 당대 최고의 벽화가였습니다. 아카데미와 아방가르드 양쪽에서 존경받은 드문 작가로, 국립미술협회 회장을 지냈습니다.','「신성한 숲」은 리옹 미술관 계단 벽화를 화가가 직접 줄여 다시 그린 것입니다. 원근감을 일부러 줄이고 인물을 가로로 늘어세운 띠 같은 구성을 보십시오.'],\n'Odilon Redon':['1840–1916 · 프랑스 보르도','1890년 무렵까지 목탄과 석판화로 괴물과 눈알 같은 환상을 그린 \"검은 그림\"으로 알려졌습니다. 에드거 앨런 포에게 바친 판화집도 냈습니다. 1890년대 이후에는 파스텔과 유채로 눈부신 색채의 꽃과 신화를 그렸습니다.','1900년 이후의 꽃 그림은 꽃병 윤곽과 배경이 흐려 꽃이 환영처럼 떠 있습니다. 파스텔 가루의 보송한 질감은 가까이에서만 보입니다.'],\n'Les Nabis':['뷔야르 1868–1940 · 드니 1870–1943 · 발로통 1865–1925 · 보나르 1867–1947','1888년 세뤼지에가 퐁타벤에서 고갱의 지도로 그린 작은 풍경화 「부적」에서 출발한 쥘리앙 아카데미 학생들의 모임입니다. \"나비\"는 히브리어로 예언자를 뜻합니다. 뷔야르와 보나르는 실내를 그린 앵티미스트, 드니는 종교화가이자 이론가, 스위스 출신 발로통은 목판화로도 유명합니다.','보나르 「지상 낙원」은 아담과 이브를 거대한 장식적 풍경 속에 작게 넣었습니다. 드니 「부활절의 신비」는 성경 장면을 현대의 풍경 속에 옮겨 놓은 방식을 보십시오.'],\n'Edvard Munch':['1863–1944 · 노르웨이 뢰텐','어린 시절 어머니와 누나를 결핵으로 잃었고, 그 경험이 평생의 주제가 됩니다. 파리에서 인상주의와 후기 인상주의를 접한 뒤 베를린에서 「생의 프리즈」 연작을 그렸습니다. 「절규」도 같은 시기 작품입니다.','「창가의 소녀」는 「절규」와 같은 1893년 작입니다. 잠옷 차림 소녀의 뒷모습과 창틀이 만드는 십자 형태에 주목해 보십시오.'],\n'Mary Cassatt':['1844–1926 · 미국 피츠버그','미국인으로 파리에 정착했고, 드가의 권유로 1879년부터 인상주의전에 참여했습니다. 어머니와 아이의 일상을 주로 그렸고, 미국 수집가들에게 인상주의를 소개하는 다리 역할을 했습니다.','「아이의 목욕」은 위에서 내려다보는 시점과 줄무늬 옷, 바닥 무늬가 겹치는 구성에서 일본 판화의 영향이 드러납니다. 판화 「목욕하는 여인」과 함께 보시면 좋습니다.'],\n'John Singer Sargent':['1856–1925 · 이탈리아 피렌체 (미국 국적)','유럽을 떠돌며 자란 미국인으로, 파리에서 초상화가로 이름을 날렸습니다. 「마담 X」 스캔들 뒤 런던으로 옮겼고, 모네와 교류하며 야외의 빛을 그린 수채화를 많이 남겼습니다.','「조지 스윈턴 부인」은 흰 드레스와 분홍 비단 위에서 빛이 부서지는 빠른 붓질이 볼거리입니다. 가까이 가면 몇 번의 붓질로 천의 주름을 끝낸 것이 보입니다.'],\n'Winslow Homer':['1836–1910 · 미국 보스턴','남북전쟁 때 잡지 삽화가로 일했고, 말년에는 메인주 바닷가 프라우츠넥에 살며 바다와 어부를 그렸습니다. 19세기 미국 회화의 대표 작가입니다.','「청어 그물」은 거친 파도 위 작은 배에서 그물을 끌어올리는 두 어부를 그렸습니다. 배와 수평선이 기울어진 각도로 바다의 흔들림을 전합니다.'],\n'Auguste Rodin':['1840–1917 · 프랑스 파리','근대 조각의 아버지로 불립니다. 아카데미식의 매끈한 조각 대신 거친 표면과 과장된 몸짓으로 감정을 드러냈습니다.','울퉁불퉁한 청동 표면에서 빛이 부서지는 효과는 인상주의 회화의 붓질과 통합니다. 「칼레의 시민」은 크게 강조된 손과 발을 보십시오.'],\n'Henri Fantin-Latour':['1836–1904 · 프랑스 그르노블','꽃 정물화로 이름을 얻었고, 마네와 그 주변 화가들을 그린 집단 초상화로 인상주의 그룹을 기록했습니다. 그룹 전시에는 참여하지 않았습니다.','「에두아르 마네」 초상은 스캔들의 주인공이던 친구를 단정한 신사로 그렸습니다. 마네가 실제로 어떤 사람이었는지 보여 주는 기록이기도 합니다.'],\n'George Wesley Bellows':['1882–1925 · 미국 오하이오주 콜럼버스','뉴욕의 거리와 권투 경기를 힘찬 붓질로 그린 애시캔파 작가입니다.','「겨울의 즐거움」은 스케이트장 군중의 활기를 굵은 붓질과 밝은 색 점으로 표현했습니다. 인상주의가 20세기 미국 도시에서 어떻게 변했는지 보여 줍니다.'],\n'William Merritt Chase':['1849–1916 · 미국 인디애나주','뮌헨에서 배운 뒤 뉴욕에서 활동한 화가이자 교육자입니다. 시네콕 여름 학교에서 많은 미국 화가에게 야외 사생을 가르쳤습니다.','「도시 공원」은 뉴욕 공원의 한낮 빛을 밝은 색과 넓은 여백으로 담았습니다. 미국식 인상주의의 산뜻함이 잘 드러납니다.'],\n'William James Glackens':['1870–1938 · 미국 필라델피아','신문 삽화가 출신으로 애시캔파와 함께 활동했고, 점차 르누아르의 영향을 받아 화사한 색으로 바뀌었습니다.','「무캥 식당에서」는 뉴욕 레스토랑의 밤 풍경으로, 마네의 카페 그림을 미국으로 옮겨 온 듯한 작품입니다.'],\n'George Inness':['1825–1894 · 미국 뉴욕주','허드슨강파 뒤를 이어 안개와 어스름이 깔린 서정적 풍경을 그린 토널리즘의 대표 작가입니다.','「이른 아침, 타폰 스프링스」는 플로리다의 새벽 공기를 부드러운 색조로 녹여 낸 말년작입니다.'],\n'Henry Ossawa Tanner':['1859–1937 · 미국 피츠버그','국제적 명성을 얻은 최초의 흑인 미국 화가로, 인종 차별을 피해 파리에 정착해 종교화를 그렸습니다.','「무덤 앞의 두 제자」는 텅 빈 무덤을 들여다보는 두 제자의 얼굴에 떨어지는 빛이 그림의 전부입니다. 1906년 이 미술관에서 상을 받은 작품입니다.'],\n'Hermann Dudley Murphy':['1867–1945 · 미국 매사추세츠주','보스턴에서 활동한 화가로, 직접 조각하고 금박을 입힌 액자 제작으로도 유명합니다.','파리 유학 시절 동료 헨리 오사와 태너를 그린 초상이 있습니다. 액자까지 작가의 작품인지 함께 살펴보십시오.'],\n'Antonio Mancini':['1852–1930 · 이탈리아 로마','나폴리에서 활동한 화가로, 물감을 두껍게 쌓는 대담한 기법으로 사전트에게 높이 평가받았습니다.','물감 두께가 만드는 요철을 옆에서 비스듬히 보십시오. 빛을 받으면 화면이 거의 부조처럼 보입니다.'],\n'Cecilia Beaux':['1855–1942 · 미국 필라델피아','당대 최고의 초상화가 중 한 명으로, 펜실베이니아 미술 아카데미 최초의 여성 정교수였습니다.','「도로테아와 프란체스카」는 춤을 배우는 두 소녀의 움직임을 흰 드레스의 빠른 붓질로 잡아냈습니다.'],\n'Eugène Louis Boudin':['1824–1898 · 프랑스 옹플뢰르','노르망디 해변을 야외에서 그린 화가로, 소년 모네에게 야외 사생을 처음 가르쳤습니다. 코로는 그를 \"하늘의 왕\"이라 불렀습니다.','「다가오는 폭풍」처럼 하늘이 화면의 대부분을 차지하는 구성을 보십시오. 모네가 무엇을 배웠는지 바로 보입니다.'],\n'Jean Louis Forain':['1852–1931 · 프랑스 랭스','신랄한 풍자화로 유명하며, 드가의 영향을 받아 인상주의전에 네 번 참여했습니다.','「줄타기 곡예사」는 드가처럼 공연의 한순간을 잘라 낸 구도가 특징입니다.'],\n'Frédéric Bazille':['1841–1870 · 프랑스 몽펠리에','부유한 집안 출신으로 모네와 르누아르에게 화실과 생활비를 나눠 준 후원자였습니다. 1870년 보불전쟁에 참전해 29세로 전사해, 첫 인상주의전을 보지 못했습니다.','야외의 강한 햇빛 아래 인물을 또렷하게 그린 방식에서 초기 인상주의의 실험을 확인할 수 있습니다.']\n};\nconst pct=y=>((y-Y0)/(Y1-Y0)*100).toFixed(3)+'%';\nconst iiif=(id,w)=>`https://www.artic.edu/iiif/2/${id}/full/${w>=1000?'1686,':'843,'}/0/default.jpg`;\nconst norm=s=>(s||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase();\n\nclass Component extends DCLogic {\n  state = { imgs:{}, done:{}, gallery:null, lb:null, extra:{}, others:[], more:{}, exLoading:true };\n  componentDidMount(){\n    if(!document.getElementById('kr-fonts')){ const l=document.createElement('link'); l.id='kr-fonts'; l.rel='stylesheet';\n      l.href=['https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900','family=Noto+Sans+KR:wght@400;500;700','display=swap'].join('&'); document.head.appendChild(l); }\n    if(!window.__sameTab){ window.__sameTab=true;\n      document.addEventListener('click',e=>{ const a=e.target.closest&&e.target.closest('a[href^=\"http\"]'); if(!a||e.metaKey||e.ctrlKey) return;\n        e.preventDefault(); e.stopImmediatePropagation(); window.location.assign(a.href); },true); }\n    this.load(); this.loadExtras(); }\n  scope(){ return this.state.scope||this.props.extrasScope||'onView'; }\n  componentDidUpdate(p){ if(p&&p.extrasScope!==this.props.extrasScope&&!this.state.scope) this.loadExtras(); }\n  async api(must){\n    const onView=this.scope()==='onView';\n    const params={query:{bool:{must,...(onView?{filter:[{term:{is_on_view:true}}]}:{})}},fields:['id','title','image_id','artist_title','date_display','gallery_title','is_on_view'],limit:100};\n    const r=await fetch(`https://api.artic.edu/api/v1/artworks/search?params=${encodeURIComponent(JSON.stringify(params))}`);\n    return (await r.json()).data||[];\n  }\n  async loadExtras(){\n    const scope=this.scope(), CK='aic-extra-v3-'+scope;\n    let c=null; try{c=JSON.parse(localStorage.getItem(CK)||'null')}catch(e){}\n    if(c){ this.setState({extra:c.extra,others:c.others,exLoading:false}); return; }\n    this.setState({exLoading:true});\n    const extra={}, jobs=[]; let failed=false;\n    D.forEach((s,si)=>s.artists.forEach((a,ai)=>{ const ss=a.s?[a.s]:[...new Set(a.works.map(w=>w[5]))]; ss.forEach(sn=>jobs.push({key:`artist-${si}-${ai}`,sn})); }));\n    const run=async()=>{ while(jobs.length){ const j=jobs.shift();\n      try{ const rows=await this.api([{match:{artist_title:`${j.sn} ${norm(j.sn)}`}}]);\n        extra[j.key]=(extra[j.key]||[]).concat(rows.filter(x=>norm(x.artist_title).includes(norm(j.sn))));\n      }catch(e){ failed=true; }\n    }};\n    await Promise.all([run(),run(),run()]);\n    let others=[];\n    try{\n      const known=[]; D.forEach(s=>s.artists.forEach(a=>{ if(a.s) known.push(norm(a.s)); a.works.forEach(w=>w[5]&&known.push(w[5])); }));\n      const rows=await this.api([{match:{style_title:'impressionism'}}]);\n      const g={}; rows.forEach(x=>{ const n=x.artist_title||'작가 미상'; if(known.some(k=>norm(n).includes(k))) return; (g[n]=g[n]||[]).push(x); });\n      others=Object.entries(g).sort((a,b)=>b[1].length-a[1].length).map(([name,list])=>({name,list}));\n    }catch(e){ failed=true; }\n    Object.values(extra).forEach(l=>l.sort((a,b)=>a.id-b.id));\n    if(!failed) try{localStorage.setItem(CK,JSON.stringify({extra,others}))}catch(e){}\n    this.setState({extra,others,exLoading:false});\n  }\n  async load(){\n    let cache={}; try{cache=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}\n    Object.entries(PIN).forEach(([q,[id,img,t,d]])=>{ cache[q]={id,img,t,d}; });\n    this.setState({imgs:{...cache}});\n    const jobs=[];\n    D.forEach(s=>s.artists.forEach(a=>a.works.forEach(w=>{ if(!cache[w[2]]) jobs.push({q:w[2],m:norm(w[5]||a.s)}); })));\n    const run=async()=>{ while(jobs.length){ const j=jobs.shift();\n      let hit=null;\n      try{\n        const r=await fetch(`https://api.artic.edu/api/v1/artworks/search?q=${encodeURIComponent(j.q)}&fields=id,title,image_id,artist_title,date_display,artwork_type_title&limit=20`);\n        const d=await r.json();\n        const ok=TK[j.q]||(()=>true);\n        hit=(d.data||[]).find(x=>x.image_id&&norm(x.artist_title).includes(j.m)&&ok(x))||null;\n      }catch(e){}\n      if(hit){ cache[j.q]={id:hit.id,img:hit.image_id,t:hit.title,d:hit.date_display}; try{localStorage.setItem(K,JSON.stringify(cache))}catch(e){} }\n      this.setState(s=>({imgs:hit?{...s.imgs,[j.q]:cache[j.q]}:s.imgs,done:{...s.done,[j.q]:true}}));\n    }};\n    await Promise.all([run(),run(),run(),run()]);\n  }\n  go(id){ const el=document.getElementById(id); if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-70,behavior:'smooth'}); }\n  renderVals(){\n    const {imgs,done,gallery,lb,extra,others,more,exLoading}=this.state;\n    const showImages=this.props.showImages ?? true;\n    const all=new Set(); let count=0, exCount=0;\n    const listed=new Set(Object.values(imgs).map(h=>h.id));\n    const galNum=x=>{const m=(x.gallery_title||'').match(/\\d+/); return m?m[0]:null;};\n    const mkEx=(anchor,rows,artistName)=>{\n      const seen=new Set();\n      const list=rows.filter(x=>{ if(listed.has(x.id)||seen.has(x.id)) return false; seen.add(x.id); const g=galNum(x); if(g&&x.is_on_view) all.add(g); return !gallery||g===gallery; });\n      exCount+=list.length;\n      const open=!!more[anchor], LIM=12;\n      const shown=(open?list:list.slice(0,LIM)).map(x=>{ const g=galNum(x);\n        const where=x.is_on_view?(g?g+'번':(x.gallery_title||'전시 중')):'미전시';\n        return {ko:KT[x.id]||x.title,title:KT[x.id]?x.title:'',meta:[x.date_display,where].filter(Boolean).join(' · '),hasImg:!!x.im
